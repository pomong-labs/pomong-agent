<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- v0.6.3: 핀치 확대(브라우저 기본 줌)를 막아 네이티브 앱처럼 쓴다. noVNC 화면 조작은 앱이 직접 처리한다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Pomong Agent</title>
    <meta name="description" content="Pomong Agent — 내 서버에 설치하는 개인 AI 비서. BYOK 멀티 LLM, 서버 관제, 암호화 금고." />
    <!--
      v0.6.7: 상태바 색을 기기 설정(라이트/다크)에 맞춰 **두 메타**로 나눴다.
      값은 본문 표면색(--pa-surface)과 같은 #FFFFFF / #1B1923 이다. 저장된 테마가 기기 설정과 다르면
      아래 첫 페인트 스크립트가 모든 theme-color 메타를 저장된 색으로 다시 맞춘다.
    -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1923" media="(prefers-color-scheme: dark)" />
    <!--
      v0.6.7: 콜드 스타트·백그라운드 복귀 순간에 흰 띠가 비치지 않도록, CSS가 오기 전 첫 페인트부터
      기기 설정에 맞는 배경으로 칠해 둔다(저장된 테마가 있으면 바로 아래 스크립트가 인라인으로 덮어쓴다).
    -->
    <style>
      html,
      body {
        background-color: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1b1923;
          color-scheme: dark;
        }
      }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- v0.6.3: 다크모드에서 iOS 상태바 영역이 흰 띠로 남지 않도록 화면 전체를 덮는 방식 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pomong" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- v0.6.3: iOS PWA 시작 화면(라이트/다크) -->
    <link rel="apple-touch-startup-image" href="/splash/1170x2532-light.png" media="(prefers-color-scheme: light) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1170x2532-dark.png" media="(prefers-color-scheme: dark) and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1179x2556-light.png" media="(prefers-color-scheme: light) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1179x2556-dark.png" media="(prefers-color-scheme: dark) and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1290x2796-light.png" media="(prefers-color-scheme: light) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1290x2796-dark.png" media="(prefers-color-scheme: dark) and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1125x2436-light.png" media="(prefers-color-scheme: light) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash/1125x2436-dark.png" media="(prefers-color-scheme: dark) and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />

    <link rel="preconnect" href="https://spoqa.github.io" />
    <link
      rel="stylesheet"
      href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css"
    />
    <!-- v0.6.4: 설정에서 고른 글꼴(프리텐다드). 고르지 않으면 파일을 받지 않는다(font-display: swap). -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media='all'"
    />
    <!-- v0.5.6: 저장된 테마(라이트/다크/기기 설정 따름 + 포인트 컬러)를 첫 페인트 전에 적용해 깜빡임을 없앤다 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pomong.theme');
          if (!raw) return;
          var s = JSON.parse(raw);
          var mode =
            s.mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : s.mode === 'dark'
                ? 'dark'
                : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', mode === 'dark');
          root.dataset.theme = mode;
          root.dataset.themeMode = s.mode || 'light';
          root.style.colorScheme = mode;
          if (s.vars && typeof s.vars === 'object') {
            Object.keys(s.vars).forEach(function (key) {
              root.style.setProperty(key, s.vars[key]);
            });
          }
          // v0.6.7: 상태바 색 = 본문 표면색(--pa-surface) = 라이트 #FFFFFF / 다크 #1B1923.
          // v0.6.6까지 저장된 vars 의 --pa-top 은 포인트 컬러를 섞은 옛 값이라 쓰지 않고,
          // 모드에서 바로 정해 덮어쓴다(업데이트 직후 콜드 스타트에 옛 틴트가 비치지 않게).
          var top = mode === 'dark' ? '#1B1923' : '#FFFFFF';
          root.style.setProperty('--pa-top', top);
          // media 쿼리로 나뉜 theme-color 메타가 둘이므로 전부 맞춘다.
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i += 1) metas[i].setAttribute('content', top);
          root.style.backgroundColor = top;
        } catch (e) {
          /* 테마 정보가 없거나 깨졌으면 기본 라이트로 둔다 */
        }
      })();
      /* v0.6.4: 저장된 글꼴을 첫 페인트 전에 적용해 글꼴이 바뀌며 깜빡이지 않게 한다. */
      (function () {
        try {
          var font = localStorage.getItem('pomong.font');
          var root = document.documentElement;
          var map = {
            pretendard: 'font-pretendard',
            kakaobigsans: 'font-kakaobigsans',
            paperlogy: 'font-paperlogy',
            nanumsquareround: 'font-nanumsquareround',
          };
          if (map[font]) {
            root.dataset.font = font;
            root.classList.add(map[font]);
          }
          /* v0.6.18: 볼드체도 첫 페인트부터 적용 */
          if (localStorage.getItem('pomong.bold') === '1') {
            root.classList.add('pa-bold');
            root.dataset.bold = 'on';
          }
        } catch (e) {
          /* 저장된 값이 없으면 기본 글꼴 */
        }
      })();
      /* v0.6.3: iOS 사파리 핀치·더블탭 확대 차단(앱처럼 고정).
         브라우저 화면(noVNC) 안에서는 두 손가락 조작을 건드리지 않는다. */
      (function () {
        var inViewer = function (target) {
          try {
            return Boolean(target && target.closest && target.closest('[data-pa-viewer], canvas'));
          } catch (e) {
            return false;
          }
        };
        var stopGesture = function (e) { if (!inViewer(e.target)) e.preventDefault(); };
        document.addEventListener('gesturestart', stopGesture, { passive: false });
        document.addEventListener('gesturechange', stopGesture, { passive: false });
        document.addEventListener('gestureend', stopGesture, { passive: false });
        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches && e.touches.length > 1 && !inViewer(e.target)) e.preventDefault();
          },
          { passive: false }
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
